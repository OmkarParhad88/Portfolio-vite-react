server {
  listen 80;
  server_name portfolio.omkarparhad.com www.portfolio.omkarparhad.com;

  location / {
    # Serve static assets from the build directory
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # This rule is key for client-side routing.
    # It tries to serve a file directly, and if it fails,
    # it serves index.html, allowing the React app to handle the routing.
    try_files $uri $uri/ /index.html;
  }
}